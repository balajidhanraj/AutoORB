services:
  shoonya-orb:
    build: .
    container_name: shoonya-orb-algo
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - HEADLESS_BROWSER=true
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    shm_size: "512m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
