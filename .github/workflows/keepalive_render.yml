name: Keep Render Free Tier Awake (IST Active Hours)

on:
  schedule:
    # Mon-Fri NSE market prep & session: every 5 min from 02:00-11:55 UTC (07:30-17:25 IST)
    - cron: "*/5 2-11 * * 1-5"
    # Overnight & weekends: keep Free Tier container warm so runtime state stays active 24/7
    - cron: "*/10 0-1,12-23 * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /health endpoint
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL || 'https://autoorb-eu.onrender.com' }}
        run: |
          curl -fsS --retry 2 --retry-delay 5 --max-time 45 "${RENDER_APP_URL%/}/health"
          echo ""
