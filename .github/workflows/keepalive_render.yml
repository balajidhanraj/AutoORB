name: Keep Render Free Tier Awake (IST Active Hours)

on:
  schedule:
    # Daily 02:00-18:50 UTC == 07:30-00:20 IST (every 10 minutes)
    - cron: "*/10 2-18 * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /health endpoint
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL || 'https://autoorb-xeha.onrender.com' }}
        run: |
          curl -fsS --max-time 45 "${RENDER_APP_URL%/}/health"
          echo ""
