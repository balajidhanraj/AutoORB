name: Keep Render Free Tier Awake (IST Market Hours)

on:
  schedule:
    # Mon-Fri 02:50-10:20 UTC == 08:20-15:50 IST (every 10 minutes)
    - cron: "*/10 2-10 * * 1-5"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /health endpoint
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "RENDER_APP_URL is not configured yet; skipping keep-alive ping."
            exit 0
          fi
          curl -fsS --max-time 30 "${RENDER_APP_URL%/}/health"
          echo ""
