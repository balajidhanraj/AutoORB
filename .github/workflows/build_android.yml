name: Build AutoORB Android App (APK & AAB)

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Optional backend HTTPS URL baked into APK (overrides PROD/DEV_API_URL)"
        required: false
        default: ""

jobs:
  build:
    name: Build Android APK and Google Play AAB Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Resolve Backend URL for Target Environment
        id: envurl
        run: |
          PROD_URL="${{ vars.PROD_API_URL }}"
          DEV_URL="${{ vars.DEV_API_URL }}"
          if [ -z "$PROD_URL" ]; then PROD_URL="https://balajidhanraj-shoonya-orb.hf.space"; fi
          if [ -z "$DEV_URL" ]; then DEV_URL="https://balajidhanraj-shoonya-orb.hf.space"; fi

          if [ -n "${{ github.event.inputs.api_base }}" ]; then
            API_BASE="${{ github.event.inputs.api_base }}"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            API_BASE="$DEV_URL"
          else
            API_BASE="$PROD_URL"
          fi

          echo "PROD_API_URL=$PROD_URL" >> "$GITHUB_ENV"
          echo "DEV_API_URL=$DEV_URL" >> "$GITHUB_ENV"
          echo "ANDROID_API_BASE=$API_BASE" >> "$GITHUB_ENV"

      - name: Sync Web Assets & Install Mobile Dependencies
        run: |
          python3 scripts/sync_mobile.py
          cd mobile
          npm ci || npm install
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Release AAB (Google Play Store Bundle)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          cd mobile/android
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK Artifact (Prod)
        if: github.ref != 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: AutoORB-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Debug APK Artifact (Dev)
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: AutoORB-dev-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Play Store AAB Bundle
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AutoORB-playstore-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Prepare Direct Download APK Named Copy
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/app/build/outputs/apk/debug/AutoORB-debug.apk

      - name: Publish Latest APK to GitHub Releases (latest-apk)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "AutoORB Latest Android APK"
          body: "Automated Android debug APK and Play Store AAB bundle built from latest main branch."
          prerelease: false
          make_latest: true
          files: |
            mobile/android/app/build/outputs/apk/debug/AutoORB-debug.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
